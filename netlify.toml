[build]
  command = "npm run build"
  publish = "dist"

# ============================================================ security headers
# Kept byte-for-byte in step with vercel.json, which is the live target — two
# hosts answering the same site with different security postures is worse than
# either one alone. docs/security-headers.md explains every directive and holds
# the checklist for turning the CSP on.
#
# WHY THE CSP IS REPORT-ONLY
# --------------------------
# Crisp's l.js bootstraps further hosts that are not named anywhere in this
# repository, and the CMS lets staff point image_url and the GCash qrUrl at any
# host they like. A policy written blind would have taken the live chat or the
# booking page's images down. Report-Only collects the violations without
# blocking anything; walk docs/security-headers.md, then rename the header to
# Content-Security-Policy — the value does not change.
#
# Two directives below do nothing while the header is Report-Only, and both are
# deliberate: frame-ancestors (which is why X-Frame-Options is set separately
# and enforced today) and upgrade-insecure-requests (the console says it is
# ignored — expected, not a violation to chase).
#
# THE TWO LOOSE DIRECTIVES, ON PURPOSE
# ------------------------------------
#   style-src 'unsafe-inline' — 30 React style={{…}} props render as inline
#     style attributes, and Crisp injects its own <style>. Tightening this is a
#     refactor, not a config change.
#   img-src https: — image_url/qrUrl are staff-entered free text. A host
#     allowlist would silently blank out CMS photos the day someone uses a new
#     one, and an image tag is not a script.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' https://client.crisp.chat; style-src 'self' 'unsafe-inline' https://client.crisp.chat; font-src 'self' data: https://client.crisp.chat; img-src 'self' data: blob: https:; media-src 'self' blob: https://gxjhrtejzbpjtjedbtxl.supabase.co; connect-src 'self' https://gxjhrtejzbpjtjedbtxl.supabase.co wss://gxjhrtejzbpjtjedbtxl.supabase.co https://api.emailjs.com https://*.crisp.chat wss://*.crisp.chat; frame-src https://maps.google.com https://www.google.com https://*.crisp.chat; worker-src 'self' blob:; upgrade-insecure-requests"
    # The staff login was framable, so the dashboard could be clickjacked. This
    # one is enforced from the moment it ships — unlike frame-ancestors above,
    # X-Frame-Options is not weakened by the CSP being Report-Only.
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # No "preload": that is a one-way door needing a submission at
    # hstspreload.org and every subdomain on HTTPS forever. Add it deliberately,
    # not as a side effect of this commit.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Everything under /assets/ carries a content hash in its filename, so the URL
# changes whenever the bytes do and it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML is what points at those hashed files. Cache it and a deploy would be
# invisible until the old copy expired.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# The single-page-app fallback: any path with no file behind it is answered
# with the shell, and React reads the URL from there.
#
# It has no "!" on purpose. Without the force flag Netlify serves a real file
# when one exists, which is what lets dist/menu/index.html — the copy that has
# the menu page's own title and og:image baked into it — reach a crawler.
# Adding "!" would send every request to the home page's HTML and silently
# undo scripts/seo-postbuild.mjs.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
